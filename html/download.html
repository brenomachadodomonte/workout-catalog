<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Workout Catalog...</title>
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1083461497991158');
        fbq('track', 'InitiateCheckout');

        (function() {
            var iosUrl = "https://apps.apple.com/br/app/workoutcatalog/id6767911903";
            var androidUrl = "https://play.google.com/store/apps/details?id=dev.brenomachado.workoutcatalog";
            var fallbackUrl = "https://workoutcatalog.com/";

            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosUrl);
                return;
            }

            // Android detection
            if (/android/i.test(userAgent)) {
                window.location.replace(androidUrl);
                return;
            }

            // Fallback
            window.location.replace(fallbackUrl);
        })();
    </script>
    <noscript>
        <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1083461497991158&ev=InitiateCheckout&noscript=1"/>
    </noscript>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .message {
            text-align: center;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Redirecting...</h1>
        <p>If you are not redirected, <a id="manual-link" href="https://workoutcatalog.com/">click here</a>.</p>
    </div>
    <script>
        // Update manual link based on OS if redirection didn't happen immediately
        (function() {
            var iosUrl = "https://apps.apple.com/br/app/workoutcatalog/id6767911903";
            var androidUrl = "https://play.google.com/store/apps/details?id=dev.brenomachado.workoutcatalog";
            var fallbackUrl = "https://workoutcatalog.com/";
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var link = document.getElementById('manual-link');

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                link.href = iosUrl;
            } else if (/android/i.test(userAgent)) {
                link.href = androidUrl;
            } else {
                link.href = fallbackUrl;
            }
        })();
    </script>
</body>
</html>
