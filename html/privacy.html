          <h2>4. Compartilhamento de Dados</h2>
          <p>O aplicativo não vende, compartilha ou transfere dados pessoais dos usuários para terceiros.</p>
          <p>Como os dados permanecem armazenados localmente no dispositivo, somente o próprio usuário possui acesso às informações cadastradas.</p>

          <h2>5. Backup e Troca de Dispositivo</h2>
          <p>Ao trocar de aparelho, o usuário deve utilizar os recursos de migração ou backup disponibilizados pelo Android ou iOS para preservar seus dados.</p>
          <p>A transferência correta dos dados depende da utilização das ferramentas oficiais do sistema operacional.</p>

          <h2>6. Segurança</h2>
          <p>O aplicativo busca utilizar boas práticas de desenvolvimento para proteger as informações armazenadas localmente no dispositivo do usuário.</p>
          <p>No entanto, nenhuma forma de armazenamento eletrônico é totalmente livre de riscos. O usuário também é responsável por manter seu aparelho protegido.</p>

          <h2>7. Serviços de Terceiros</h2>
          <p>O aplicativo pode utilizar serviços externos apenas para funcionalidades específicas, como carregamento de imagens ou animações de exercícios.</p>
          <p>Esses serviços podem possuir políticas próprias de privacidade.</p>

          <h2>8. Privacidade Infantil</h2>
          <p>O aplicativo não é direcionado especificamente para crianças menores de 13 anos e não realiza coleta intencional de dados pessoais infantis.</p>

    const languageSelect = document.getElementById("language");
    const policyTitle = document.getElementById("policyTitle");
    const policyContent = document.getElementById("policyContent");
    const languageLabel = document.querySelector("label[for='language']");

    function renderPolicy(language) {
      const policy = policies[language] || policies.en;
      document.documentElement.lang = language;
      policyTitle.textContent = policy.title;
      languageLabel.textContent = policy.languageLabel;
      policyContent.innerHTML = policy.html;
    }

    languageSelect.addEventListener("change", (event) => {
      renderPolicy(event.target.value);
    });

    languageSelect.value = "pt";
    renderPolicy("pt");
