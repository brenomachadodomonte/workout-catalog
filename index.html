<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Catalog - App Landing</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f2937, #0f172a 55%);
      color: #f8fafc;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 36px 24px;
      display: grid;
      gap: 28px;
    }

    .logo {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 170px;
      height: 140px;
      display: grid;
      place-items: center;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .logo-text {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 650;
      text-align: center;
    }

    .store-buttons {
      display: grid;
      gap: 12px;
    }

    .store-btn {
      display: grid;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(15, 23, 42, 0.8);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .store-btn:hover,
    .store-btn:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(34, 211, 238, 0.7);
      background: rgba(30, 41, 59, 0.95);
      outline: none;
    }

    .store-label {
      color: #cbd5e1;
      font-size: 0.8rem;
    }

    .store-name {
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .contact {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 18px;
      display: grid;
      gap: 8px;
    }

    .contact-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .contact-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
    }

    .contact-link {
      color: #f8fafc;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      color: #22d3ee;
      outline: none;
    }

    @media (max-width: 420px) {
      .card {
        padding: 28px 18px;
      }

      .logo-mark {
        width: 150px;
        height: 122px;
      }

      .logo-text {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
